<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки про-игроков Dota 2</title>
<style>
:root{
  --bg:#14181d; --panel:#1d242c; --line:#2c3641; --text:#e8e4da; --muted:#8d96a0; --gold:#d4a24c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 24px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;transition:border-color .15s}
.tile:hover,.tile:focus-visible{border-color:var(--gold);outline:none}
.tile .cover{aspect-ratio:16/9;background:#0f1317;display:block;width:100%;object-fit:cover}
.tile .info{padding:12px 14px}
.tile b{display:block;font-size:20px}
.tile span{color:var(--muted);font-size:14px}
.back{display:inline-block;margin-bottom:20px;color:var(--gold);text-decoration:none}
.back:hover{text-decoration:underline}
.meta{color:var(--muted);margin:0 0 24px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.shot{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shot button{display:block;width:100%;padding:0;border:0;background:#0f1317;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{padding:10px 14px;font-size:15px}
.missing{padding:40px 12px;text-align:center;color:var(--muted);font-size:14px}
#lb{position:fixed;inset:0;background:rgba(8,10,13,.94);display:none;align-items:center;justify-content:center;z-index:10}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:84vh;object-fit:contain}
#lb p{position:absolute;bottom:18px;left:0;right:0;text-align:center;margin:0;padding:0 70px}
#lb button{position:absolute;background:none;border:0;color:var(--text);font-size:40px;cursor:pointer;padding:12px 18px}
#lb .x{top:6px;right:6px}#lb .l{left:6px;top:50%}#lb .r{right:6px;top:50%}
#lb button:focus-visible{outline:2px solid var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Просмотр скриншота">
  <button class="x" aria-label="Закрыть">×</button>
  <button class="l" aria-label="Назад">‹</button>
  <img alt="">
  <button class="r" aria-label="Вперёд">›</button>
  <p></p>
</div>

<script>
/* ===== ТВОИ ДАННЫЕ — правишь только этот блок =====
   Структура папок:  img/<folder>/<файл>.png
   Новый игрок = новый объект в массиве PLAYERS. */
const SITE = {
  title: "Настройки про-игроков Dota 2"
};

const PLAYERS = [
  {
    nick: "Yatoro", folder: "yatoro", date: "октябрь 2026",
    count: 6   // сколько картинок лежит в img/yatoro/ (1.png, 2.png ... 6.png)
    // необязательно: captions: ["Управление", "Расширенное управление", ...]
  },
  {
    nick: "Watsoncombo", folder: "watsoncombo", date: "октябрь 2026",
    count: 5
  },
  {
    nick: "Satanic", folder: "satanic", date: "октябрь 2026",
    count: 8
  },
  {
    nick: "Malr1ne", folder: "malr1ne", date: "октябрь 2026",
    count: 9
  },
  {
    nick: "Collapse", folder: "collapse", date: "октябрь 2026",
    count: 5
  },
  {
    nick: "Topson", folder: "topson", date: "октябрь 2026",
    count: 3
  },
  {
    nick: "Gpk", folder: "gpk", date: "октябрь 2026",
    count: 5
  },
  {
    nick: "Miposhka", folder: "miposhka", date: "октябрь 2026",
    count: 5
  }
];
/* ===== конец блока с данными ===== */

/* картинки называй просто 1.png, 2.png, 3.png ... — подписи не обязательны */
PLAYERS.forEach(p => {
  if (!p.shots) p.shots = Array.from({ length: p.count }, (_, i) => ({
    file: `${i + 1}.${p.ext || "png"}`, caption: (p.captions || [])[i] || ""
  }));
});

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src = (p, s) => `img/${p.folder}/${s.file}`;
let current = [], idx = 0;

function renderIndex(){
  document.title = SITE.title;
  app.innerHTML = `
    <h1>${esc(SITE.title)}</h1>
    <div class="grid">${PLAYERS.map(p => `
      <a class="tile" href="#${esc(p.folder)}">
        <img class="cover" src="${esc(src(p, p.shots[0]))}" alt="" loading="lazy" onerror="this.removeAttribute('src')">
        <div class="info"><b>${esc(p.nick)}</b><span>скринов: ${p.shots.length}</span></div>
      </a>`).join("")}
    </div>`;
}

function renderPlayer(p){
  document.title = `${p.nick} — ${SITE.title}`;
  current = p.shots.map(s => ({ url: src(p, s), caption: s.caption }));
  app.innerHTML = `
    <a class="back" href="#">‹ Все игроки</a>
    <h1>${esc(p.nick)}</h1>
    <p class="meta">${esc(p.date)}</p>
    <div class="shots">${p.shots.map((s, i) => `
      <figure class="shot">
        <button data-i="${i}" aria-label="Открыть скриншот ${i + 1}">
          <img src="${esc(src(p, s))}" alt="${esc(p.nick)}, скриншот ${i + 1}" loading="lazy"
               onerror="this.outerHTML='<div class=missing>Нет файла ${esc(s.file)}</div>'">
        </button>
        ${s.caption ? `<figcaption>${esc(s.caption)}</figcaption>` : ""}
      </figure>`).join("")}
    </div>`;
}

function route(){
  const key = decodeURIComponent(location.hash.slice(1));
  const p = PLAYERS.find(x => x.folder === key);
  p ? renderPlayer(p) : renderIndex();
  closeLb();
  window.scrollTo(0, 0);
}

/* лайтбокс */
const lb = document.getElementById("lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector("p");
function showLb(i){
  idx = (i + current.length) % current.length;
  lbImg.src = current[idx].url; lbCap.textContent = current[idx].caption;
  lb.classList.add("on");
}
function closeLb(){ lb.classList.remove("on"); }
app.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) showLb(+b.dataset.i); });
lb.querySelector(".x").onclick = closeLb;
lb.querySelector(".l").onclick = () => showLb(idx - 1);
lb.querySelector(".r").onclick = () => showLb(idx + 1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") showLb(idx - 1);
  if (e.key === "ArrowRight") showLb(idx + 1);
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
